<style>
#rain-back use,#rain-front use{animation-name:fb;animation-timing-function:linear;
animation-iteration-count:infinite}
#rain-front use{animation-name:ff}
@keyframes fb{from{transform:translateY(0)}to{transform:translateY(220px)}}
@keyframes ff{from{transform:translateY(0)}to{transform:translateY(330px)}}
#camera,#cloud,#umbrella,#seated-body,#seated-head,#man-body,#man-arm,#man-head,#plant
{transform-box:view-box}
@media (prefers-reduced-motion:no-preference){
#camera{transform-origin:504px 560px;animation:cam 18s ease-in-out infinite}
@keyframes cam{0%,100%{transform:scale(1)}50%{transform:scale(1.022) translateX(-3px)}}
#cloud{transform-origin:504px 0;animation:cloud 15s ease-in-out infinite}
@keyframes cloud{0%,100%{transform:translate(0,0) scale(1,1)}
50%{transform:translate(-4px,2px) scale(1.005,1.02)}}
#umbrella{transform-origin:505px 592px;animation:rock 9s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.65deg)}}
#man-arm{transform-origin:692px 540px;animation:arm 9s ease-in-out infinite}
@keyframes arm{0%,100%{transform:rotate(.34deg)}50%{transform:rotate(-.36deg)}}
#man-head{transform-origin:742px 480px;animation:mhead 7.5s ease-in-out infinite}
@keyframes mhead{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.42deg)}}
#man-body{transform-origin:700px 944px;animation:stand 6.4s ease-in-out infinite}
@keyframes stand{0%,100%{transform:scale(1,1)}50%{transform:scale(.9985,1.0035)}}
#seated-head{transform-origin:270px 718px;animation:shead 6.8s ease-in-out infinite}
@keyframes shead{0%,100%{transform:rotate(.55deg)}50%{transform:rotate(-.62deg)}}
#seated-body{transform-origin:300px 944px;animation:breathe 5.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.003,1.007)}}
#plant{transform-origin:100px 1019px;animation:sway 5.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
}
</style>
</svg>